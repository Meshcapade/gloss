[package]
name = "easy-wgpu"
authors.workspace = true
description = "Small wrapper around wgpu for easy use with gloss-rs"
edition.workspace = true
publish = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/easy-wgpu"
repository.workspace = true

[features]
default = ["with-gui"]
with-gui=["dep:epaint"]
burn-torch = [
    "tch",
    "wgpu-cuda-interop/cuda",
    "cust_raw",
    ]


[dependencies]

#workspace internal gloss
gloss-utils.workspace=true
gloss-img.workspace=true
#for cuda
wgpu-cuda-interop = { workspace = true, optional = true }
tch= { workspace = true, optional = true }
cust_raw = { workspace = true, optional = true }


type-map.workspace=true #needed for egui_renderer
thiserror.workspace=true
log.workspace=true
wgpu.workspace=true
wgpu-hal.workspace=true
image.workspace=true
bytemuck.workspace=true
futures.workspace=true
futures-intrusive.workspace=true
epaint={ workspace = true, optional = true }
enum-map.workspace=true
smallvec.workspace=true
encase.workspace=true
pollster.workspace=true

[lints]
workspace = true