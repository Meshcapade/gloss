[package]
name = "easy-wgpu"
authors.workspace = true
description = "Small wrapper around wgpu for easy use with gloss-rs"
edition.workspace = true
publish = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/easy-wgpu"
repository.workspace = true

[features]
default = ["with-gui"]
with-gui=["dep:epaint"]

[dependencies]
type-map = "0.5.0" #needed for egui_renderer
thiserror = "1.0"

#workspace internal gloss
gloss-utils.workspace=true
gloss-img.workspace=true

log.workspace=true
wgpu.workspace=true
image.workspace=true
bytemuck.workspace=true
futures.workspace=true
futures-intrusive.workspace=true
epaint={ workspace = true, optional = true }
enum-map.workspace=true
smallvec.workspace=true
encase.workspace=true
pollster.workspace=true

[lints]
workspace = true