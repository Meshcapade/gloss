[package]
name = "gloss-utils"
authors.workspace = true
description = "Small library for utility functions in gloss"
edition.workspace = true
publish = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gloss-utils"
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# default = ["log_with_time"]
default = []
log_with_time =[]
burn-torch = ["burn/burn-tch"]

[dependencies]
#local to package


#workspace internal gloss

#workspace third-party
strum.workspace=true
strum_macros.workspace=true
log.workspace=true
env_logger.workspace=true
nalgebra.workspace=true
config.workspace=true
toml.workspace=true
bytemuck.workspace=true
burn.workspace=true
ndarray.workspace=true
num-traits.workspace=true
re_memory.workspace=true
smallvec.workspace=true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
abi_stable.workspace=true

#more dependancies for wasm https://sotrh.github.io/learn-wgpu/beginner/tutorial1-window/#added-support-for-the-web
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace=true
console_log.workspace=true
wasm-bindgen.workspace=true
wasm-bindgen-futures.workspace=true
web-sys.workspace=true
js-sys.workspace=true


[lints]
workspace = true



